name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: swift test --package-path macos/CodexUsageStatus
      - run: python3 lifecycle/test_lifecycle.py
      - run: npm run build:macos
        env:
          BUILD_ARCH: ${{ matrix.arch }}
